name: manse-lang
version: 1.0.0
synopsis: A programming language that speaks the Tampere dialect
license: BSD3
author: Jussi Saurio
extra-source-files:
  - README.md
  - ChangeLog.md
  - prelude/*.manse

language: GHC2024

default-extensions:
  - OverloadedStrings
  - LambdaCase
  - MultiWayIf
  - TypeFamilies
  - DataKinds
  - UndecidableInstances
  - DerivingVia
  - PatternSynonyms
  - StrictData

ghc-options:
  - -Wall
  - -Wno-name-shadowing
  - -Wno-unused-do-bind
  # The package is manse-lang and the main module is Manse; on case-insensitive
  # file systems clang complains about paths differing only in case.
  - -optP-Wno-nonportable-include-path

dependencies:
  - base >= 4.21 && < 5
  - containers
  - text
  - mtl
  - megaparsec
  - parser-combinators
  - vector
  - time
  - random
  - file-embed

library:
  source-dirs: src

executables:
  manse:
    main: Main.hs
    source-dirs: app
    ghc-options: [-threaded, -rtsopts, -O2]
    dependencies:
      - manse-lang
      - haskeline
      - directory

tests:
  manse-test:
    main: Spec.hs
    source-dirs: test
    ghc-options: [-threaded, -rtsopts]
    dependencies:
      - manse-lang
      - hspec
      - directory
      - filepath
